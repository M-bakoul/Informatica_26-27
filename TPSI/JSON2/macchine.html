<!DOCTYPE html>
<html>
    <head>
        <title>Prova rubrica json</title>
    </head>
    <body>
        <button id="btnCaricaArchivio">Carica Intera Lista</button>
        <button id="btnCaricauniproprietario">Carica Uniproprietari</button>
        <br /><br />



        <form id="formCerca" onsubmit="event.preventDefault(); cercaProvincia();">
        <label for="ricercaProvincia">Cerca per provincia</label>
        <input type="search" id="ricercaProvincia" name="q" placeholder="Scrivi provincia">
        <button type="submit" id="btnCaricaProvincia">Cerca</button>
        </form> 


        <form id="formCerca" onsubmit="event.preventDefault(); cercaMarca();">
        <label for="ricercaMarca">Cerca per marca</label>
        <input type="search" id="ricercaMarca" name="q" placeholder="Scrivi marca">
        <button type="submit" id="btnCaricaMarca">Cerca</button>
        </form> 
    </br>

        <form id="formCerca" onsubmit="event.preventDefault(); cercaAnno();">
            <label for="dato1">Primo Anno (Inizio):</label>
            <input type="number" id="dato1" name="annoInizio" value="2000">

            <label for="dato2">Secondo Anno (Fine):</label>
            <input type="number" id="dato2" name="annoFine" value="2026">

            <button type="submit" id="btnCaricaAnno">Invia Dati</button>
        </form>

    </br>

<!---
        Et&agrave; minima: <input type="text" id="anniRichiesti">
        <button id="btnEtaMinima">Et&agrave; maggiore o uguale di...</button>
        <br /><br />     -->
        <div id="viewBox" style="border: solid 1px rgb(200,0,0);">Seleziona una opzione</div>
        



        <script>

            // Visualizzazione intero archivio.
            async function visualizzazioneArchivio(){

                const promise = await fetch("macchine.json");
                const vettArchivio = await promise.json();
                let vb = document.querySelector("#viewBox");

                vb.innerHTML = "Numero di JSON ricevuti: "+vettArchivio.length+"<br /><br />";

                for(let i=0; i < vettArchivio.length; i++){
                    vb.innerHTML += vettArchivio[i].Marca + " " + vettArchivio[i].Modello + " " + vettArchivio[i].Anno_Immatricolazione + " " + vettArchivio[i].Provincia + " " + vettArchivio[i].Uniproprietario + " " +  vettArchivio[i].Kilometraggio + "<br />";
                }
            }

            // Visualizzazione autovetture uniproprietario.
            async function caricaUniproprietario(){

                const promise = await fetch("macchine.json");
                const vettArchivio = await promise.json();
                let vb = document.querySelector("#viewBox");

                vb.innerHTML = "Numero di JSON ricevuti: "+vettArchivio.length+"<br /><br />";

                for(let i=0; i < vettArchivio.length; i++){
                    if(vettArchivio[i].Uniproprietario){
                        vb.innerHTML += vettArchivio[i].Marca + " " + vettArchivio[i].Modello + " " + vettArchivio[i].Anno_Immatricolazione + " " + vettArchivio[i].Provincia + " " + vettArchivio[i].Uniproprietario + " " +  vettArchivio[i].Kilometraggio + "<br />";
                    }
                }
            }

            // Ricerca e visualizzazione autovetture secondo la Provincia.

            async function cercaProvincia(){
                const promise = await fetch("macchine.json");
                const vettArchivio = await promise.json();
                // const provincia = document.getElementById('ricercaProvincia');
                let provincia = document.getElementById("ricercaProvincia").value.toUpperCase().trim();
                let vb = document.querySelector("#viewBox");

                // vb.innerHTML = "Numero di JSON ricevuti: "+vettArchivio.length+"<br /><br />";
                vb.innerHTML = ""; 
                

                for(let i=0; i < vettArchivio.length; i++){
                    if(vettArchivio[i].Provincia.toUpperCase() == provincia){
                        vb.innerHTML += vettArchivio[i].Marca + " " + vettArchivio[i].Modello + " " + vettArchivio[i].Anno_Immatricolazione + " " + vettArchivio[i].Provincia + " " + vettArchivio[i].Uniproprietario + " " +  vettArchivio[i].Kilometraggio + "<br />";
                    }
                }

            }

            
            async function cercaMarca(){
                const promise = await fetch("macchine.json");
                const vettArchivio = await promise.json();
                // const provincia = document.getElementById('ricercaProvincia');
                let marca = document.getElementById("ricercaMarca").value.toUpperCase().trim();
                let vb = document.querySelector("#viewBox");

                // vb.innerHTML = "Numero di JSON ricevuti: "+vettArchivio.length+"<br /><br />";
                vb.innerHTML = ""; 
                

                for(let i=0; i < vettArchivio.length; i++){
                    if(vettArchivio[i].Marca.toUpperCase() == marca){
                        vb.innerHTML += vettArchivio[i].Marca + " " + vettArchivio[i].Modello + " " + vettArchivio[i].Anno_Immatricolazione + " " + vettArchivio[i].Provincia + " " + vettArchivio[i].Uniproprietario + " " +  vettArchivio[i].Kilometraggio + "<br />";
                    }
                }
            }

            async function cercaAnno(){
                const promise = await fetch("macchine.json");
                const vettArchivio = await promise.json();
                // event.preventDefault(); // Blocca il ricaricamento della pagina

                const primoDato = parseInt(document.getElementById('dato1').value);
                const secondoDato = parseInt(document.getElementById('dato2').value);





                let vb = document.querySelector("#viewBox");

                vb.innerHTML = ""; 
                

                for(let i=0; i < vettArchivio.length; i++){

                    let annoMacchina = parseInt(vettArchivio[i].Anno_Immatricolazione);

                    if(annoMacchina >= primoDato && annoMacchina <= secondoDato){
                        vb.innerHTML += vettArchivio[i].Marca + " " + vettArchivio[i].Modello + " " + vettArchivio[i].Anno_Immatricolazione + " " + vettArchivio[i].Provincia + " " + vettArchivio[i].Uniproprietario + " " +  vettArchivio[i].Kilometraggio + "<br />";
                    }
                }
            }
            



            let btnCaricaArchivio = document.querySelector("#btnCaricaArchivio");
            btnCaricaArchivio.addEventListener('click', visualizzazioneArchivio);

            let btnCaricauniproprietario = document.querySelector("#btnCaricauniproprietario");
            btnCaricauniproprietario.addEventListener('click', caricaUniproprietario);

            let btnCaricaProvincia = document.querySelector("#btnCaricaProvincia");
            btnCaricaProvincia.addEventListener('click', cercaProvincia);

            let btnCaricaMarca = document.querySelector("#btnCaricaMarca");
            btnCaricaMarca.addEventListener('click', cercaMarca);
/*
            let btnCaricaAnno = document.querySelector("#btnCaricaAnno");
            btnCaricaAnno.addEventListener('click', cercaAnno); */
        </script>
    </body>
</html>
